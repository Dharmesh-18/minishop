name: MiniShop CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 21 JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Give Execution Permission to Maven Wrapper
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 4. Build with Maven and Run All Tests (Including Testcontainers)
      - name: Build with Maven & Run Tests
        run: ./mvnw clean verify -B -e

  docker-build:
    name: Build Docker Image
    needs: build-and-test # Tests पास होने के बाद ही यह चलेगा
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker Image (Without Pushing to Registry)
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: minishop-service:latest